[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-calculator"
version = "1.0.0"
description = "Integrated Density of States (IDS) Calculator for Archimidean Lattices"
readme = "README.md"
authors = [
    {name = "Stephan Epp", email = "hjstephan86@gmail.com"}
]
keywords = ["density-of-states", "integrated-density", "lattice", "physics", "numerical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.3.0",
    "pytest-timeout>=1.4.0",
    "pytest-sugar>=0.9.4",
    "black>=21.5b0",
    "flake8>=3.9.0",
    "pylint>=2.8.0",
    "isort>=5.9.0",
    "mypy>=0.910",
    "coverage[toml]>=5.5",
]

docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.2",
]

test = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.3.0",
    "pytest-timeout>=1.4.0",
    "pytest-sugar>=0.9.4",
    "coverage[toml]>=5.5",
]

[project.urls]
Homepage = "https://github.com/hjstephan86/ids"
Repository = "https://github.com/hjstephan86/ids.git"
Issues = "https://github.com/hjstephan86/ids/issues"
Documentation = "https://github.com/hjstephan86/ids#readme"

# ╔════════════════════════════════════════════════════════════════════════╗
# ║                         PYTEST KONFIGURATION                          ║
# ╚════════════════════════════════════════════════════════════════════════╝

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=html:doc/coverage",
    "--cov-report=term-missing",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
    "--cov-fail-under=80",
]

markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: integration tests",
]

# ╔════════════════════════════════════════════════════════════════════════╗
# ║                      CODE COVERAGE KONFIGURATION                      ║
# ╚════════════════════════════════════════════════════════════════════════╝

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/experiments.py",
    "*/site-packages/*",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractproperty",
    "if 0:",
    "if False:",
]
fail_under = 80

[tool.coverage.html]
directory = "doc/coverage"

[tool.coverage.xml]
output = "coverage.xml"

# ╔════════════════════════════════════════════════════════════════════════╗
# ║                          LINTING & FORMATTING                         ║
# ╚════════════════════════════════════════════════════════════════════════╝

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = 39
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-many-arguments",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100
